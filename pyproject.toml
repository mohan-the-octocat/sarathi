[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-orchestra"
version = "1.0.0"
description = "Model-agnostic conductor plugin for Antigravity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Mohan Sridharan", email = "mohansridharan@google.com" }
]
keywords = [
    "antigravity",
    "jetski",
    "orchestra",
    "agentic-ai",
    "conductor",
    "subagents",
    "mcp"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/mohan-the-octocat/antigravity-orchestra"
Repository = "https://github.com/mohan-the-octocat/antigravity-orchestra"
Issues = "https://github.com/mohan-the-octocat/antigravity-orchestra/issues"

[project.scripts]
orchestra-install = "scripts.install:main"
orchestra-detect-tampering = "scripts.detect_test_tampering:main"
orchestra-verify-receipts = "scripts.reconcile_receipts:main"
